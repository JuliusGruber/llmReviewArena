# Review Arena - Default Configuration
# These values are used when not overridden by arena.yaml or CLI arguments

limits:
  rounds: 3  # Maximum allowed is 5 (will be capped if higher)
  max-output-size-kb: 500

execution:
  max-concurrent: 0  # 0 = unlimited

timeouts:
  agent-timeout-ms: 300000    # 5 minutes
  round-timeout-ms: 900000    # 15 minutes
  grace-period-ms: 5000       # 5 seconds
  on-timeout: kill-and-skip
  preserve-partial-output: false

tournament:
  min-agents: 2

output:
  dir: .arena

# Default agents (can be overridden in arena.yaml)
# Note: Prompt is delivered via stdin redirection (not as command argument)
agents:
  claude:
    command:
      - claude
      - -p                    # print mode (non-interactive, reads prompt from stdin)
    flags:
      auto-approve: true
    enabled: true

  codex:
    command:
      - codex
      - -q                    # quiet mode requires prompt as positional arg, not stdin
    flags:
      auto-approve: true
    enabled: false            # Disabled: codex -q requires prompt as argument, not stdin

  gemini:
    command:
      - gemini                # positional prompt mode (reads from stdin)
    flags:
      auto-approve: true
    enabled: true
