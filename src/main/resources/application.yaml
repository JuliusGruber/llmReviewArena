# Review Arena - Default Configuration
# These values are used when not overridden by arena.yaml or CLI arguments

#==============================================================================
# META: Configuration metadata (moved from Java constants)
#==============================================================================
meta:
  # Valid agent types - add new types here, no Java changes needed
  known-agent-types:
    - claude
    - codex
    - gemini

  # Type inference from agent name prefixes
  # Agent "claude-fast" -> type "claude", "anthropic-agent" -> type "claude"
  type-aliases:
    claude:
      - claude
      - anthropic
    codex:
      - codex
      - openai
    gemini:
      - gemini
      - google

#==============================================================================
# AGENT-DEFAULTS: Applied when agent properties not specified
#==============================================================================
agent-defaults:
  enabled: true
  docker:
    enabled: false
    sandbox: false

limits:
  rounds: 5  # Maximum allowed is 5 (will be capped if higher)
  max-output-size-kb: 500

execution:
  max-concurrent: 0  # 0 = unlimited
  show-agent-output: true  # Stream agent output to console with prefixes

timeouts:
  agent-timeout-ms: 600000    # 10 minutes per agent
  round-timeout-ms: 900000    # 15 minutes
  grace-period-ms: 5000       # 5 seconds
  on-timeout: kill-and-skip
  preserve-partial-output: false

tournament:
  min-agents: 1  # Changed from 2 - self-consistent with only claude enabled

output:
  dir: .arena

review-agents: claude, claude, claude  # Shorthand: type names, auto-expanded to claude-1, claude-2, claude-3

# Default agents - type templates and synthesis agent
# Note: Prompt is delivered via stdin redirection (not as command argument)
agents:
  # Type templates: used by review-agents expansion to create numbered instances
  claude:
    type: claude
    command:
      - claude
      - -p                    # print mode (non-interactive, reads prompt from stdin)
    flags:
      auto-approve: true
      output-format: json     # Single JSON output with .result field
    enabled: true

  codex:
    type: codex
    command:
      - codex
      - exec
      - --full-auto
      - -o
      - "@output"
      - "-"                   # Read prompt from stdin
    flags:
      auto-approve: false     # --full-auto already embedded in command above
      show-output: false      # Codex CLI streams verbose internal output (prompt echoes, exec commands);
                              # suppress console display - output is still captured in stdout.log
    enabled: false            # Disabled by default; enable in arena.yaml if codex is installed

  gemini:
    type: gemini
    command:
      - gemini                # positional prompt mode (reads from stdin)
    flags:
      auto-approve: true
    enabled: false            # Disabled by default - enable in arena.yaml if needed

  # Synthesis agent - disabled for tournament rounds, but required for final synthesis
  synthesis:
    type: claude
    command:
      - claude
      - -p
    flags:
      auto-approve: true
    enabled: false            # Disabled for tournament, but used for synthesis
