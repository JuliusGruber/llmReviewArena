# Local arena configuration - overrides only
# Base defaults are in src/main/resources/application.yaml
#
# review-agents uses type shorthands (claude, codex, gemini).
# The system auto-generates numbered instances (claude-1, codex-1, claude-2).
#
# To enable Docker for generated instances, configure it on the type template:
#   agents.claude.docker:
#     enabled: true
#     image: "docker/sandbox-templates:claude-code"
#
# Authenticate locally first with: claude /login
# Credentials from ~/.claude/ are mounted into the container

review-agents: claude, claude, claude

timeouts:
  # Cross-pollination rounds (1+) require agents to re-read all prior reviews,
  # verify each claim, and produce a synthesized review. The default 10 min is
  # only enough for Round 0; Opus 4.7 reliably exceeds it on Round 1+.
  agent-timeout-ms: 1800000   # 30 minutes per agent

agents:
  # Claude review agent: use Opus 4.7 model for highest-quality reviews
  claude:
    command:
      - claude
      - -p
      - --model
      - claude-opus-4-7

  # Synthesis agent: local execution with Opus 4.7 model
  # Disabled for tournament rounds, used only for final synthesis
  synthesis:
    command:
      - claude
      - -p
      - --model
      - claude-opus-4-7

  # Codex: local execution (uses codex CLI from PATH)
  # --full-auto is embedded in command above; auto-approve: false prevents CommandBuilder
  # from injecting it (CommandBuilder.java:97 short-circuits on false before the dedup
  # guard at line 99 is reached). Explicit false is the cleaner signal that flag injection
  # is handled entirely via the command list.
  codex:
    docker:
      enabled: false
    flags:
      auto-approve: false
    command:
      - codex
      - exec
      - --full-auto
      - -o
      - "@output"
      - "-"   # Read prompt from stdin

  # Gemini: uncomment to enable
  # gemini:
  #   docker:
  #     enabled: true
  #     image: "tgagor/gemini-cli:latest"
  #   enabled: true
