# Local arena configuration to enable all agents
agents:
  claude:
    type: claude
    # Regular Docker mode with credential mounting
    # Authenticate locally first with: claude /login
    # Credentials from ~/.claude/ are mounted into the container
    docker:
      enabled: true
      sandbox: false
      image: "docker/sandbox-templates:claude-code"
    command:
      - claude
      - -p
      - --include-partial-messages  # Required for stream-json tool use visibility
    flags:
      auto-approve: true
      verbose: true           # Required for stream-json output
      output-format: stream-json  # Shows tool use, reasoning, token usage in real-time
    enabled: true

  claude2:
    type: claude
    # Second Claude instance
    docker:
      enabled: true
      sandbox: false
      image: "docker/sandbox-templates:claude-code"
    command:
      - claude
      - -p
      - --include-partial-messages
    flags:
      auto-approve: true
      verbose: true
      output-format: stream-json
    enabled: true

  claude3:
    type: claude
    # Third Claude instance
    docker:
      enabled: true
      sandbox: false
      image: "docker/sandbox-templates:claude-code"
    command:
      - claude
      - -p
      - --include-partial-messages
    flags:
      auto-approve: true
      verbose: true
      output-format: stream-json
    enabled: true

  # Codex - temporarily disabled
  codex:
    type: codex
    # Docker mode requires building Codex image locally:
    #   git clone https://github.com/openai/codex-universal
    #   docker build -t codex-universal:latest .
    # docker:
    #   enabled: true
    #   image: "codex-universal:latest"  # Required - no default image
    command:
      - python
      - src/main/resources/codex-wrapper.py
      - "@prompt.md"
      - "@output"
    flags:
      auto-approve: true
    enabled: false  # Explicitly disabled

  # Gemini - temporarily disabled
  gemini:
    type: gemini
    # docker:
    #   enabled: true
    #   image: "naoyoshinori/gemini-cli:node"  # Optional, uses default
    command:
      - gemini
    flags:
      auto-approve: true
    enabled: false  # Explicitly disabled

limits:
  rounds: 5  # Maximum allowed is 5 (will be capped if higher)

tournament:
  min-agents: 1
