# Local arena configuration to enable all agents
agents:
  claude1:
    type: claude
    # Regular Docker mode with credential mounting
    # Authenticate locally first with: claude /login
    # Credentials from ~/.claude/ are mounted into the container
    docker:
      enabled: true
      sandbox: false
      image: "docker/sandbox-templates:claude-code"
    command:
      - claude
      - -p
    flags:
      auto-approve: true
      output-format: json  # Single JSON output with .result field
    enabled: true

  claude2:
    type: claude
    # Second Claude instance
    docker:
      enabled: true
      sandbox: false
      image: "docker/sandbox-templates:claude-code"
    command:
      - claude
      - -p
    flags:
      auto-approve: true
      output-format: json  # Single JSON output with .result field
    enabled: true

    claude3:
      type: claude
      # Second Claude instance
      docker:
        enabled: true
        sandbox: false
        image: "docker/sandbox-templates:claude-code"
      command:
        - claude
        - -p
      flags:
        auto-approve: true
        output-format: json  # Single JSON output with .result field
      enabled: true

  # Codex - Docker mode enabled (temporarily disabled)
